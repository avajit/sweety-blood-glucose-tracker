name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sweety_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sweety_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sweety_test
      NODE_ENV: test
      JWT_SECRET: ci_test_secret_at_least_32_characters_long
      JWT_EXPIRES_IN: 7d
      COOKIE_SECURE: false
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3000
      LOG_LEVEL: error
      APP_TIMEZONE: Asia/Kolkata
      VITE_APP_TIMEZONE: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=server/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
